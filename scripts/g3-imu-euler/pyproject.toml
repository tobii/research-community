[tool.poetry]
name = "g3-imu-euler"
version = "0.1.0"
description = "Head orientation (Euler angles) from a raw Tobii Pro Glasses 3 recording"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.24"
scipy = ">=1.10"
